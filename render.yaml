services:
  # ── Django Backend Service ──────────────────────────────────────────────────
  - type: web
    name: flashbite-backend
    runtime: python
    region: frankfurt # Closest low-latency region
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements/prod.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DJANGO_DEBUG
        value: "False"

  # ── Next.js Frontend Service ────────────────────────────────────────────────
  - type: web
    name: flashbite-frontend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: 20.17.0
